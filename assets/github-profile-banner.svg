<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="banner2_title">
  <title id="banner2_title">Sk Ashfaq Bux: Executive Minimalist Banner</title>
  <defs>
    <!-- Dark Obsidian Canvas -->
    <linearGradient id="bg2" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>

    <!-- Emerald / Teal Accent Gradient -->
    <linearGradient id="emerald_cyan" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ea44f"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>

    <!-- Subtle Radial Spotlight -->
    <radialGradient id="spotlight" cx="600" cy="170" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="340" rx="16" fill="url(#bg2)"/>
  <rect width="1200" height="340" rx="16" fill="url(#spotlight)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" stroke="#30363d" stroke-width="1"/>

  <!-- Top Accent Neon Bar -->
  <rect x="40" y="0" width="1120" height="3" rx="1.5" fill="url(#emerald_cyan)"/>

  <!-- Center Content Layout -->
  <g transform="translate(80, 56)">
    <!-- Authority Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="26" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#3fb950"/>
      <text x="26" y="17" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.5">SYSTEMS &amp; BACKEND ARCHITECT</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="74" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="44" font-weight="900" letter-spacing="-1">SK ASHFAQ BUX</text>

    <!-- Core Pitch -->
    <text x="0" y="112" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="18" font-weight="600">Enterprise Database Internals &amp; Autonomous Distributed Workflows</text>
    
    <text x="0" y="142" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', sans-serif" font-size="14.5">Zero-downtime PostgreSQL 18 migrations, sub-millisecond query optimization, and Java 21 LTS microservices.</text>

    <!-- 3 Big Metric Pillards -->
    <g transform="translate(0, 178)">
      <!-- Metric 1 -->
      <g>
        <rect x="0" y="0" width="220" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="16" y="20" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">DELIVERABLES</text>
        <text x="16" y="38" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">43 Verified Live</text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(236, 0)">
        <rect x="0" y="0" width="220" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="16" y="20" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">TEST PASS RATE</text>
        <text x="16" y="38" fill="#00f0ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">100% Deterministic</text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(472, 0)">
        <rect x="0" y="0" width="220" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="16" y="20" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">SECURITY AUDIT</text>
        <text x="16" y="38" fill="#a371f7" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">SARIF Zero Defects</text>
      </g>

      <!-- Metric 4 -->
      <g transform="translate(708, 0)">
        <rect x="0" y="0" width="240" height="48" rx="8" fill="#161b22" stroke="#30363d"/>
        <text x="16" y="20" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">CORE STACK</text>
        <text x="16" y="38" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="600">Java 21 / Postgres 18</text>
      </g>
    </g>
  </g>
</svg>
